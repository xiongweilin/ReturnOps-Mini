<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReturnOps Mini</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.7;color:#18202a}code,pre{background:#f2f4f7;padding:2px 5px;border-radius:4px}section{border:1px solid #ddd;border-radius:10px;padding:18px;margin:16px 0}</style></head><body><h1>ReturnOps Mini</h1><p>用于提升<strong>工程判断</strong>能力的小型多租户退货退款系统。</p><section><h2>第一版本</h2><p>当前版本已经包含多租户、RBAC、状态机、乐观并发控制、幂等、Outbox、退款外部调用、Webhook、UNKNOWN 结果和对账等核心机制。</p></section><section><h2>建议使用方式</h2><p>先阅读 <code>docs/invariants.md</code>，再使用 <code>docs/ai-judgment-training.md</code> 让 AI 以追问者和反方 Reviewer 的方式训练你的判断，而不是直接替你给答案。</p></section><section><h2>API</h2><p>交互式接口文档：<a href="/docs">/docs</a>；健康检查：<a href="/health">/health</a>。</p></section></body></html>
