name: controlled demo integration

on:
  # Browser E2E and the full Docker/n8n runtime are expensive, local-only acceptance tests.
  # Run them explicitly from Actions when validating a demo-stack or workflow change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-integration:
    name: browser E2E and n8n runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: returnflow-ci-${{ github.run_id }}-${{ github.run_attempt }}
      RETURNFLOW_FRONTEND_URL: http://127.0.0.1:4173
      N8N_BASE_URL: http://127.0.0.1:5678
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/webhook/return-intake
      MAILPIT_BASE_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"

      - name: Install Python test dependencies
        run: pip install -e ".[dev]"

      - name: Install frontend browser-test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the isolated demo and automatically provision n8n
        shell: pwsh
        run: ./scripts/start-demo.ps1

      - name: Verify the complete demo stack
        shell: pwsh
        run: ./scripts/verify-demo.ps1

      - name: Browser E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Create the UNKNOWN payment scenario
        shell: pwsh
        run: ./scripts/run-unknown-demo.ps1 -OrderRef DEMO-ORDER-UNKNOWN-981

      - name: Browser recovery E2E
        working-directory: frontend
        shell: pwsh
        run: |
          $env:RUN_FAULT_E2E = '1'
          npm run test:e2e:fault

      - name: Production n8n Intake webhook integration
        working-directory: frontend
        shell: pwsh
        run: |
          $env:RUN_N8N_INTEGRATION = '1'
          npm run test:n8n

      - name: Manual n8n digest and Mailpit integration
        working-directory: frontend
        run: node scripts/test-n8n-digest.mjs

      - name: Remove only this ephemeral demo project and its test volumes
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.env') {
            docker compose -p $env:COMPOSE_PROJECT_NAME down --volumes --remove-orphans
            if ($LASTEXITCODE -ne 0) { throw "Ephemeral Compose cleanup failed with exit code $LASTEXITCODE" }
          }
          else {
            Write-Host 'No isolated Compose project was created; nothing to remove.'
          }
