name: ci

# 分层门禁：每个 job 只对应一个明确的 failure class。
#   hygiene      workflow/仓库卫生：actionlint、zizmor、gitleaks
#   quality      代码契约：ruff format、ruff check、mypy、pytest（非 integration）
#   dependencies 依赖解析结果的已知漏洞：pip-audit
#   integration  真实 PostgreSQL 语义（SQLite 证明不了的部分）：alembic 回环 + pytest -m integration
#   image        可交付镜像及其组成：docker build、syft SBOM、grype
# PR 只跑确定且快速的确定性门禁；镜像与镜像漏洞扫描在 main、tag、手动调度上跑。
# 依赖缓存故意不启用：本流程可在 tag 上触发并产出镜像/SBOM，zizmor 的 cache-poisoning 审计要求先消解发布型流程的缓存投毒面。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ACTIONLINT_VERSION: "1.7.12.24"
  ZIZMOR_VERSION: "1.30.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: actionlint
        run: pipx run --spec "actionlint-py==${ACTIONLINT_VERSION}" actionlint -color

      - name: zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --persona=regular .github/workflows

      - name: gitleaks
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --exit-code 1

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 格式 (ruff format --check)
        run: ruff format --check .

      - name: 静态检查 (ruff check)
        run: ruff check .

      - name: 类型检查 (mypy)
        run: mypy

      - name: 单元与 API 测试 (pytest -m "not integration")
        run: pytest -q -m "not integration"

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -e ".[dev]"

      # pip-audit 审计的是本仓库解析出的安装集；OSV-Scanner 需要 lockfile 才能枚举 Python 依赖，
      # 本仓库当前没有 lockfile，因此用 pip-audit 承担同一个 failure class（依赖版本存在已知漏洞）。
      # 不用 --strict：本仓库是可编辑安装，--strict 会把“跳过可编辑包”当成收集失败。
      - name: 依赖漏洞扫描 (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: returnops
          POSTGRES_PASSWORD: returnops
          POSTGRES_DB: returnops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnops -d returnops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RETURNOPS_DATABASE_URL: postgresql+psycopg://returnops:returnops@localhost:5432/returnops
      RETURNOPS_TEST_DATABASE_URL: postgresql+psycopg://returnops:returnops@localhost:5432/returnops
      RETURNOPS_PAYMENT_WEBHOOK_SECRET: ci-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: PostgreSQL 迁移回环
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: PostgreSQL 并发与时序测试
        run: pytest -q -m integration

  image:
    name: image (build / sbom / vulnerability)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 构建镜像
        run: docker build --tag returnops-mini:ci .

      - name: SBOM (syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: returnops-mini:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - name: 镜像漏洞扫描 (grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: returnops-mini:ci
          severity-cutoff: high
          # 只让已有修复版本的 high/critical 阻塞：基础镜像中被 Debian 标记为不会修复的漏洞
          # 本仓库无法处置，它们仍完整出现在 SBOM 中，只是不作为本仓库的失败类。
          only-fixed: true
          fail-build: true

  mutation:
    name: mutation (diagnostic)
    # 变异测试不是合并门禁：存活变异才是信号（哪个 oracle 抓不到），分数不是目标。
    # mutmut 需要 POSIX 环境，Windows 本地只能用 WSL，因此由 CI 承担。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 运行变异测试（状态机、幂等、支付、Webhook、对账）
        run: |
          set +e
          mutmut run
          echo "mutmut finished with survivors expected: exit=$?"
          set -e
          test -d mutants || { echo 'mutmut produced no report'; exit 1; }

      - name: 存活变异清单
        run: mutmut results

      - name: 上传变异报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: mutants/
          if-no-files-found: warn

  faultlab:
    name: fault lab (toxiproxy / postgres / k6)
    # 真实边界上的失败实验与性能契约：不在 PR 上跑（重、且需要容器）。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 启动 fault lab 栈
        run: docker compose -f faultlab/docker-compose.faultlab.yml up -d --build

      - name: 等待 PostgreSQL 就绪
        run: |
          for _ in {1..60}; do
            if docker compose -f faultlab/docker-compose.faultlab.yml exec -T postgres pg_isready -U returnops -d returnops >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'postgres never became ready'
          exit 1

      - name: 故障场景（延迟 / ACK 丢失 / 连接重置 / 数据库变慢）
        run: python faultlab/scenarios.py

      - name: 性能契约（错误率、p95、p99、重复副作用）
        run: python faultlab/run_perf.py

      - name: 失败时打印服务日志
        if: failure()
        run: docker compose -f faultlab/docker-compose.faultlab.yml logs --no-color | tail -n 200

      - name: 拆除 fault lab
        if: always()
        run: docker compose -f faultlab/docker-compose.faultlab.yml down -v
