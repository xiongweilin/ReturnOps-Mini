name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: returnops
          POSTGRES_PASSWORD: returnops
          POSTGRES_DB: returnops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnops -d returnops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RETURNOPS_DATABASE_URL: postgresql+psycopg://returnops:returnops@localhost:5432/returnops
      RETURNOPS_TEST_DATABASE_URL: postgresql+psycopg://returnops:returnops@localhost:5432/returnops
      RETURNOPS_PAYMENT_WEBHOOK_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -e '.[dev]'

      - name: 静态检查
        run: ruff check .

      - name: 编译检查
        run: python -m compileall -q src tests alembic

      - name: 单元与 API 测试
        run: pytest -q -m 'not integration'

      - name: PostgreSQL 迁移回环
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: PostgreSQL 并发与时序测试
        run: pytest -q -m integration
