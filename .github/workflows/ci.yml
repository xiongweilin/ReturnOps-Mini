name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -e '.[dev]'
      - name: 静态检查
        run: ruff check .
      - name: 编译检查
        run: python -m compileall -q src tests alembic
      - name: 第一阶段测试
        run: pytest -q -m 'not integration'
      - name: SQLite migration 回环
        env:
          RETURNOPS_DATABASE_URL: sqlite+pysqlite:///./ci-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
